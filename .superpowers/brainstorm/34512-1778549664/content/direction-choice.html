<h2>수상형 아이디어의 핵심 방향</h2>
<p class="subtitle">
  귀여움을 어디에 붙일지 고르면, 그 방향으로 실제 앱 콘셉트 3개를 뽑아볼게요.
</p>

<div class="options">
  <div class="option" data-choice="a" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>매일 쓰는 습관</h3>
      <p>
        저축, 소비, 출석, 기분 기록 같은 일상 행동을 귀여운 캐릭터 성장으로
        바꿉니다.
      </p>
    </div>
  </div>
  <div class="option" data-choice="b" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>공유하고 싶은 결과물</h3>
      <p>
        짧은 테스트, 카드, 짤, 영수증처럼 친구에게 보내고 싶은 귀여운 결과를
        만듭니다.
      </p>
    </div>
  </div>
  <div class="option" data-choice="c" onclick="toggleSelect(this)">
    <div class="letter">C</div>
    <div class="content">
      <h3>귀여운 소비/선물</h3>
      <p>
        굿즈, 선물, 덕질, 반려동물 지출처럼 소비 맥락을 귀엽고 똑똑하게
        다룹니다.
      </p>
    </div>
  </div>
</div>
